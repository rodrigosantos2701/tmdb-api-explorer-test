version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "NEXT_PUBLIC_TMDB_API_TOKEN=$NEXT_PUBLIC_TMDB_API_TOKEN" >> .env
        - npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
